
name: NourishLink Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests-and-build:
    name: Unit tests and Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run local unit tests
        working-directory: android/NourishLink
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android/NourishLink
        run: ./gradlew assembleDebug

      - name: Run Android lint checks
        working-directory: android/NourishLink
        run: ./gradlew lintDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nourishlink-debug-apk
          path: android/NourishLink/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nourishlink-unit-test-reports
          path: android/NourishLink/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  instrumented-tests:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    needs: unit-tests-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: cd android/NourishLink && ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nourishlink-instrumented-test-reports
          path: android/NourishLink/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
