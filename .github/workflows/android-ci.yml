
name: NourishLink Basic Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Repository Checkout Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NourishLink
        uses: actions/checkout@v4

      - name: Test repository
        run: echo "NourishLink repository checkout successful!"


      - name: Check repository files
        run: |
          echo "Checking repository files..."
          test -f README.md -o -f .gitignore
          echo "Repository files found successfully!"

          
      - name: Check project folders
        run: |
          echo "Checking project structure..."
          find . -maxdepth 2 -type d
          echo "Project folder check completed successfully!"

